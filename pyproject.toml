[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-analysis-tools"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.4",
    "matplotlib==3.11.1",
    "pyyaml==6.0.3",
    "h5py==3.16.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
]

[project.scripts]
analysis = "analysis.cli.__main__:main"
analysis-plot-classification = "analysis.cli.plot_classification:main"
analysis-plot-classification-dependencies = "analysis.cli.plot_classification_dependencies:main"
analysis-plot-direction = "analysis.cli.plot_direction_regression:main"
analysis-plot-energy = "analysis.cli.plot_energy_regression:main"
analysis-plot-loss = "analysis.cli.plot_loss:main"
analysis-plot-resolution-dependencies = "analysis.cli.plot_resolution_dependencies:main"
analysis-plot-vertex = "analysis.cli.plot_vertex_regression:main"
analysis-event-display = "analysis.cli.save_event_display_3d:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]