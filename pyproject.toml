[project]
name = "ml-analysis-tools"
version = "0.1.0"
description = "Analysis tools for machine-learning-based event reconstruction studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "omegaconf>=2.4.0",
    "pyyaml",
    "uproot>=5.7.7",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_tools"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
